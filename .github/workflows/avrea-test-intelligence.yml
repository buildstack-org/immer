name: Avrea Test Intelligence

# Runs this project's own tests on Avrea runners and writes the JUnit report
# Avrea reads. Manual only; not part of the upstream project.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: buildstack-dev-varjo
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && yarn install
      - name: Run Vitest
        run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=junit-vitest.xml
